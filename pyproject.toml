[project]
name = "boe_service"
version = "0.1.0"
description = "Answers any questions about BOE reports back to the user."
readme = "README.md"
authors = [
    { name = "Kaung Htet Myat", email = "Programmingrelated1999@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "arcticdb==6.28.0",
    "fastapi>=0.162.0",
    "langchain>=1.4.9",
    "langchain-openai>=1.7.4",
    "langchain-qdrant>=1.1.0",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.20",
    "pandas==2.3.3",
    "pydantic>=2.14.3",
    "qdrant-client==1.19.1",
    "requests>=2.34.2",
    "yfinance>=1.8.0",
]

[project.scripts]
boe-service = "boe_service:main"

[build-system]
requires = ["uv_build>=0.13.4,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.3",
]

[tool.ruff]
# Shared by both linter and formatter
line-length = 88
extend-exclude = ['reports']

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]

